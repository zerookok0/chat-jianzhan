<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIANZHAN — Jian Ware Tea Bowls | An Ancient Craft for Eternal Beauty</title>
    <meta
      name="description"
      content="JIANZHAN presents a curated view of Jian ware tea bowls — oil spot, hares fur, iridescent and jade glazes shaped by fire, earth and time. Explore the collection, the craft and the journal."
    />
    <meta name="theme-color" content="#08090A" />
    <meta name="color-scheme" content="dark" />
    <!-- Relative icon path so it resolves inside a WordPress subdirectory -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="canonical" href="https://jianzhan.studio/" />

    <!-- Locale alternates: the language lives in the visitor's preference,
         not in the path, so all locales share the same canonical URL. -->
    <link rel="alternate" hreflang="en" href="https://jianzhan.studio/" />
    <link rel="alternate" hreflang="vi-VN" href="https://jianzhan.studio/" />
    <link rel="alternate" hreflang="x-default" href="https://jianzhan.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JIANZHAN" />
    <meta property="og:title" content="JIANZHAN — An Ancient Craft for Eternal Beauty" />
    <meta
      property="og:description"
      content="A timeless art shaped by fire, earth and nature. Jian ware tea bowls presented as collectible objects."
    />
    <meta property="og:image" content="https://images.pexels.com/photos/31203862/pexels-photo-31203862.jpeg?auto=compress&cs=tinysrgb&w=1200" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <!-- Warm the TCP/TLS connection to the store that owns checkout.
         Vite substitutes %VITE_WP_SITE_URL% at build time. -->
    <link rel="preconnect" href="%VITE_WP_SITE_URL%" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!--
      ANALYTICS / PIXEL PLACEHOLDERS
      Add real IDs only when available. Nothing loads while these stay commented.

      <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
      </script>

      <script>
        !function(f,b,e,v,n,t,s){/* Meta Pixel snippet with your own ID */}(window,document,'script');
        fbq('init', 'XXXXXXXXXXXXXXX');
        fbq('track', 'PageView');
      </script>
    -->

    <!-- First-paint locale: set <html lang> from an existing manual choice
         before React mounts. It never redirects and does nothing on a first visit. -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('preferred-locale')
          var match = document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=([^;]*)/)
          var value = stored || (match ? decodeURIComponent(match[1]) : '')
          var tags = { en: 'en', vi: 'vi-VN' }
          if (value && tags[value]) {
            document.documentElement.lang = tags[value]
          }
        } catch (e) {
          /* storage or cookies blocked — the default language stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
